version: '3.9'

services:
  # LLM-Guard Proxy
  proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-guard-proxy
    ports:
      - "8888:8888"
      - "8889:8889"  # Alternative port
    environment:
      - PYTHONUNBUFFERED=1
      - UPSTREAM_URL=https://api.openai.com/v1/chat/completions
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups
      - ./models:/app/models
    restart: always
    networks:
      - llm-guard-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  
  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-guard-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    restart: always
    networks:
      - llm-guard-network
    depends_on:
      - proxy
  
  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: llm-guard-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: always
    networks:
      - llm-guard-network
    depends_on:
      - prometheus
  
  # AlertManager (Alerting)
  alertmanager:
    image: prom/alertmanager:latest
    container_name: llm-guard-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: always
    networks:
      - llm-guard-network
  
  # Redis (Caching)
  redis:
    image: redis:7-alpine
    container_name: llm-guard-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - llm-guard-network
    command: redis-server --appendonly yes

networks:
  llm-guard-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
  redis_data:
