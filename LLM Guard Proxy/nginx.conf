upstream llm_guard_backend {
    # Backend proxy servers (Week 3 proxies)
    server proxy:8888 weight=1 max_fails=3 fail_timeout=30s;
    server proxy_replica_1:8888 weight=1 max_fails=3 fail_timeout=30s backup;
    server proxy_replica_2:8888 weight=1 max_fails=3 fail_timeout=30s backup;
    
    # Keep-alive connections
    keepalive 32;
    keepalive_timeout 60s;
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=global_limit:10m rate=100r/s;
limit_req_zone $http_x_user_id zone=user_limit:10m rate=10r/s;

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name localhost;  # Change to your domain
    
    # SSL Configuration
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Logging
    access_log /var/log/nginx/llm-guard-access.log;
    error_log /var/log/nginx/llm-guard-error.log warn;
    
    # Client body size
    client_max_body_size 10m;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;
    
    # ============================================
    # Proxy endpoints
    # ============================================
    
    # Health check endpoint (no rate limit)
    location / {
        proxy_pass http://llm_guard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-ID $request_id;
    }
    
    # Main proxy endpoint (rate limited)
    location /proxy/ {
        # Apply rate limiting
        limit_req zone=global_limit burst=20 nodelay;
        limit_req zone=user_limit burst=5 nodelay;
        
        proxy_pass http://llm_guard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-ID $http_x_user_id;
        proxy_set_header X-Trace-ID $request_id;
        
        # Timeouts for this endpoint
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Metrics endpoint (no authentication, internal only)
    location /metrics {
        # Restrict to internal network
        allow 172.16.0.0/12;  # Docker network
        allow 10.0.0.0/8;     # Private network
        deny all;
        
        proxy_pass http://llm_guard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # Health endpoint (no rate limit, internal only)
    location /health {
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        deny all;
        
        proxy_pass http://llm_guard_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
    
    # Status endpoint (for monitoring)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
    
    # Error pages
    error_page 404 /404.json;
    error_page 500 502 503 504 /50x.json;
    
    location = /404.json {
        internal;
        default_type application/json;
        return 404 '{"status":"not_found","message":"Endpoint not found"}';
    }
    
    location = /50x.json {
        internal;
        default_type application/json;
        return 500 '{"status":"error","message":"Internal server error"}';
    }
}

# Monitoring
server {
    listen 8080;
    server_name _;
    
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow all;
    }
}
