global:
  resolve_timeout: 5m
  slack_api_url: 'YOUR_SLACK_WEBHOOK_URL'
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Default receiver
receiver: 'default'

# Route configuration
route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  
  # Nested routes for different alert types
  routes:
    # Critical alerts
    - match:
        severity: 'critical'
      receiver: 'critical'
      group_wait: 0s
      repeat_interval: 5m
    
    # Warning alerts
    - match:
        severity: 'warning'
      receiver: 'warning'
      group_wait: 30s
      repeat_interval: 2h
    
    # Info alerts
    - match:
        severity: 'info'
      receiver: 'info'
      group_wait: 5m
      repeat_interval: 24h

# Receivers
receivers:
  # Default receiver (Slack)
  - name: 'default'
    slack_configs:
      - channel: '#alerts'
        title: 'Alert: {{ .GroupLabels.alertname }}'
        text: '{{ .GroupLabels.service }} - {{ .Alerts.Firing | len }} firing'

  # Critical alerts (PagerDuty + Slack)
  - name: 'critical'
    slack_configs:
      - channel: '#critical-alerts'
        title: '🚨 CRITICAL: {{ .GroupLabels.alertname }}'
        text: 'Service: {{ .GroupLabels.service }}\nCluster: {{ .GroupLabels.cluster }}'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        description: 'CRITICAL: {{ .GroupLabels.alertname }}'

  # Warning alerts (Slack)
  - name: 'warning'
    slack_configs:
      - channel: '#alerts'
        title: '⚠️  WARNING: {{ .GroupLabels.alertname }}'
        text: 'Service: {{ .GroupLabels.service }}'

  # Info alerts (Email)
  - name: 'info'
    email_configs:
      - to: 'devops@example.com'
        from: 'alerts@example.com'
        smarthost: 'smtp.example.com:587'
        auth_username: 'alerts@example.com'
        auth_password: 'YOUR_EMAIL_PASSWORD'
        headers:
          Subject: 'Alert: {{ .GroupLabels.alertname }}'

# Inhibition rules (suppress alerts based on conditions)
inhibit_rules:
  # Suppress warnings if critical exists
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'cluster']

  # Suppress info if warning exists
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'service', 'cluster']
